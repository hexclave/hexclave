packages:
  - packages/*
  - apps/*
  - examples/*
  - docs
  - docs-mintlify
  - sdks/*
  - sdks/implementations/*

minimumReleaseAge: 10080

# Next.js 16.3.1 carries vercel/next.js#96653, the backport of #96599,
# which fixes the intermittent production TypeError:
# __turbopack_context__.a is not a function in dashboard builds.
# Keep this version-pinned so future releases still go through minimumReleaseAge.
minimumReleaseAgeExclude:
  - next@16.3.1
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  # GHSA-qx66-fv34-fjm8: @tanstack/start-server-core <1.169.39 is vulnerable. The fixed
  # TanStack Start release chain (react-start 1.168.60) was published 2026-09-30.
  # Keep these version-pinned so future releases still go through minimumReleaseAge.
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/react-start-client@1.168.39'
  - '@tanstack/react-start-rsc@0.1.59'
  - '@tanstack/react-start-server@1.167.46'
  - '@tanstack/react-start@1.168.60'
  - '@tanstack/react-store@0.11.2'
  - '@tanstack/router-core@1.171.34'
  - '@tanstack/router-generator@1.167.40'
  - '@tanstack/router-plugin@1.168.42'
  - '@tanstack/start-client-core@1.170.34'
  - '@tanstack/start-plugin-core@1.171.49'
  - '@tanstack/start-server-core@1.169.39'
  - '@tanstack/start-storage-context@1.167.36'
  - '@tanstack/store@0.11.2'

blockExoticSubdeps: true

overrides:
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  # Pin rolldown to 1.1.2 until 1.1.3 passes the 7-day minimumReleaseAge policy (after Jul 1 2026).
  # tsdown ~1.1.1 resolves to 1.1.3 by default, which was published Jun 24.
  rolldown: 1.1.2
  '@napi-rs/wasm-runtime': 1.1.5

packageExtensions:
  '@mintlify/link-rot':
    dependencies:
      react: '*'
      react-dom: '*'

patchedDependencies:
  openid-client@5.6.4: patches/openid-client@5.6.4.patch

allowBuilds:
  '@prisma/engines': true
  '@quetzallabs/i18n': false
  '@scarf/scarf': false
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  bcrypt: true
  codebuff: false
  core-js: true
  esbuild: true
  iframe-resizer: false
  keytar: false
  prisma: true
  protobufjs: true
  puppeteer: true
  sharp: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: false
