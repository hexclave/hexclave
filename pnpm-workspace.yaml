packages:
  - packages/*
  - apps/*
  - examples/*
  - docs
  - docs-mintlify
  - sdks/*
  - sdks/implementations/*

minimumReleaseAge: 10080

# One-time bypass so the apps can use Next.js 16.4.1 (published 2026-10-14) before it passes
# the 7-day window. Remove these entries once 16.4.1 is older than minimumReleaseAge.
# Keep this version-pinned so future releases still go through minimumReleaseAge.
minimumReleaseAgeExclude:
  - next@16.4.1
  - "@next/env@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"

blockExoticSubdeps: true

overrides:
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  # Pin rolldown to 1.1.2 until 1.1.3 passes the 7-day minimumReleaseAge policy (after Jul 1 2026).
  # tsdown ~1.1.1 resolves to 1.1.3 by default, which was published Jun 24.
  rolldown: 1.1.2
  '@napi-rs/wasm-runtime': 1.1.5

packageExtensions:
  '@mintlify/link-rot':
    dependencies:
      react: '*'
      react-dom: '*'

patchedDependencies:
  openid-client@5.6.4: patches/openid-client@5.6.4.patch

allowBuilds:
  "@prisma/engines@7.10.0": true
  "@quetzallabs/i18n@0.1.19": false
  "@sentry/cli@2.53.0 || 2.58.5": true
  "@tailwindcss/oxide@4.1.9": true
  "@vercel/speed-insights@1.0.12": true
  core-js@3.41.0: true
  esbuild@0.20.2 || 0.21.5 || 0.23.1 || 0.24.2 || 0.25.11 || 0.25.3 || 0.25.4 || 0.27.1: true
  iframe-resizer@4.4.5: false
  keytar@7.9.0: false
  prisma@7.10.0: true
  protobufjs@7.5.4 || 7.5.9 || 7.6.6: true
  puppeteer@22.14.0: true
  sharp@0.33.5 || 0.34.5 || 0.35.3 || 0.35.5: true
  lmdb@3.5.5: true
  msgpackr-extract@3.0.4: true
  better-sqlite3@11.10.0: true
  pprof@5.0.0: true
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
strictDepBuilds: true
verifyDepsBeforeRun: error
ignoreScripts: false
ignorePnpmfile: true
trustPolicyExclude:
  - "@vercel/cli-config@0.2.2"
  - "@vercel/cli-exec@1.0.1"
  - "@vercel/functions@3.9.0"
  - "@vercel/mcp-adapter@1.0.0"
  - "@vercel/oidc@3.8.2"
  - jose@4.15.5
  - prisma@7.10.0
  - semver@5.7.2
  - semver@6.3.1
  - tailwind-merge@2.6.0
  - tailwindcss@3.4.18
  - undici-types@6.19.8
  - undici-types@6.21.0
  - undici@6.19.8
  - vite@5.4.21
