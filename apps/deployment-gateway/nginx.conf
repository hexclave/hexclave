user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
# Allow active sockets to drain on config reloads. Clients must still reconnect
# during machine replacement; Fly's kill_timeout bounds shutdown during deploys.
worker_shutdown_timeout 30s;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not record query strings, cookies or request bodies in access logs.
    log_format gateway '$host $request_method $status $request_time';
    access_log /dev/stdout gateway;
    sendfile on;
    keepalive_timeout 65s;
    include /etc/nginx/conf.d/*.conf;
}
