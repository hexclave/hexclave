<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Set Up Hexclave TV Box</title>
    <link rel="stylesheet" href="/setup.css">
  </head>
  <body class="display-page">
    <main class="setup-card">
      <p class="eyebrow">Hexclave TV Box</p>
      <h1>Connect this display</h1>
      <p class="copy">On your phone or laptop, join the temporary network below. The Wi-Fi setup page will open automatically.</p>
      <dl class="credentials">
        <div><dt>Network</dt><dd id="setup-ssid">Preparing…</dd></div>
        <div><dt>Password</dt><dd id="setup-password">Preparing…</dd></div>
      </dl>
      <p class="status">If setup does not open, visit <strong>http://10.42.0.1</strong>.</p>
    </main>
    <script type="module" src="/setup.js"></script>
  </body>
</html>
