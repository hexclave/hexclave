<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Hexclave TV Box</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #070b12; color: #f4f7fb; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 15% 15%, #0b394455, transparent 38%), #070b12; }
      main { max-width: 46rem; padding: 3rem; text-align: center; }
      p:first-child { color: #57d5e9; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-size: clamp(2.5rem, 6vw, 5rem); margin: 1rem 0; }
      p:last-child { color: #a9b5c6; font-size: 1.35rem; line-height: 1.6; }
    </style>
  </head>
  <body><main><p>Hexclave TV Box</p><h1>Reconnecting…</h1><p>This display is restoring its network connection. Setup will appear automatically if the saved network remains unavailable.</p></main></body>
</html>
