PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AuthorizedKeysFile none
UsePAM no
PermitRootLogin no
PermitEmptyPasswords no
PermitUserEnvironment no
PermitUserRC no
PermitTTY no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
DisableForwarding yes
PermitTunnel no
GatewayPorts no
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 1
HostKey /var/lib/hexclave-tv-box/ssh/ssh_host_ed25519_key
HostKey /var/lib/hexclave-tv-box/ssh/ssh_host_rsa_key
TrustedUserCAKeys /etc/ssh/hexclave-support-ca.pub
AllowUsers hexclave-support

Match User hexclave-support
    AuthorizedPrincipalsFile /etc/ssh/auth_principals/%u
    ForceCommand /usr/lib/hexclave-tv-box/forced-support-command
