name: Bulldozer serialization compat
on:
  push:
    branches:
      - dev
  pull_request:

# This workflow only checks out code and runs tests; it never pushes or calls the GitHub API.
permissions:
  contents: read

# A concurrency group only ever runs one run at a time, so the sha is part of the group on main/dev:
# otherwise consecutive dev pushes queue behind each other (and GitHub cancels the older queued run),
# so one slow or hung run silently skips CI for every commit after it. PRs and feature branches stay
# grouped per ref, where cancelling superseded runs is what we want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

# *_DIR vars are repo-relative (used for diffing/overlaying). *_HARNESS_REL vars are relative to the
# bulldozer-js package, since the harnesses are run via `pnpm -C apps/bulldozer-js exec tsx`.
#   - the tree harness proves a single AugmentedTreeMap round-trips across code versions
#   - the db harness proves an *entire* Bulldozer database (all derived tables) round-trips
env:
  DATA_STRUCTURES_DIR: apps/bulldozer-js/src/databases/piledriver/data-structures
  HARNESS_REL: src/databases/piledriver/data-structures/__fixtures__/serialization-cross-version.ts
  BULLDOZER_FIXTURES_DIR: apps/bulldozer-js/src/databases/bulldozer/__fixtures__
  DB_HARNESS_REL: src/databases/bulldozer/__fixtures__/bulldozer-db-cross-version.ts

jobs:
  check-changed:
    name: Check if bulldozer serialization changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check-diff.outputs.changed }}
      base_branch: ${{ steps.check-diff.outputs.base_branch }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for serialization-relevant changes
        id: check-diff
        run: |
          # dev compares to main, everything else compares to dev.
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            BASE_BRANCH="main"
          else
            BASE_BRANCH="dev"
          fi
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT

          git fetch origin "$BASE_BRANCH"
          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_BRANCH")

          # Any change under the piledriver data-structures dir (persisted node format) or the
          # bulldozer whole-database fixtures (schema/read-model harness) could affect what is persisted.
          if git diff --quiet "$MERGE_BASE" HEAD -- "$DATA_STRUCTURES_DIR" "$BULLDOZER_FIXTURES_DIR"; then
            echo "No serialization-relevant changes"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Serialization-relevant changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # Backward compatibility (production UPGRADE): the new code must read data the old code wrote.
  # This is the direction that must ALWAYS hold — if it fails, deploying the new code would break
  # reads of already-persisted production data.
  backward-compat:
    name: Backward compat (new code reads old data)
    needs: check-changed
    if: needs.check-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          path: current

      - name: Checkout base branch (${{ needs.check-changed.outputs.base_branch }})
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ needs.check-changed.outputs.base_branch }}
          path: base

      # The harness + its utils are new, so the base checkout doesn't have them. Overlay the current
      # branch's copy onto the base tree; the harness only uses the long-stable AugmentedTreeMap /
      # piledriver public API, so it compiles and runs against the base branch's implementation.
      - name: Overlay harnesses onto base checkout
        run: |
          rm -rf "base/$DATA_STRUCTURES_DIR/__fixtures__"
          cp -r "current/$DATA_STRUCTURES_DIR/__fixtures__" "base/$DATA_STRUCTURES_DIR/__fixtures__"
          rm -rf "base/$BULLDOZER_FIXTURES_DIR"
          cp -r "current/$BULLDOZER_FIXTURES_DIR" "base/$BULLDOZER_FIXTURES_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Both checkouts live in subdirectories, so there's no package.json at the workspace root;
          # read the pnpm version from the current checkout's package.json (`packageManager`).
          package_json_file: current/package.json

      - name: Install and build @hexclave/shared (current)
        working-directory: current
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@hexclave/shared

      - name: Install and build @hexclave/shared (base)
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@hexclave/shared

      - name: Emit dumps with base code
        working-directory: base
        run: |
          pnpm -C apps/bulldozer-js exec tsx "$HARNESS_REL" emit "$GITHUB_WORKSPACE/old-tree.json"
          pnpm -C apps/bulldozer-js exec tsx "$DB_HARNESS_REL" emit "$GITHUB_WORKSPACE/old-db.json"

      - name: Current code reads base-written dumps
        working-directory: current
        run: |
          pnpm -C apps/bulldozer-js exec tsx "$HARNESS_REL" verify "$GITHUB_WORKSPACE/old-tree.json"
          pnpm -C apps/bulldozer-js exec tsx "$DB_HARNESS_REL" verify "$GITHUB_WORKSPACE/old-db.json"

  # Keeps the workflow (and the aggregate `all-good` check) green when serialization wasn't touched.
  skip-unchanged:
    name: No serialization changes (skipped)
    needs: check-changed
    if: needs.check-changed.outputs.changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No serialization-relevant changes detected
        run: echo "No changes under $DATA_STRUCTURES_DIR detected. Skipping cross-version compat."
