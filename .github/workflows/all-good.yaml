name: "all-good: Did all the other checks pass?"

on:
  push:
    branches:
      - main
      - dev
  pull_request:

# A concurrency group only ever runs one run at a time, so the sha is part of the group on main/dev:
# otherwise consecutive dev pushes queue behind each other (and GitHub cancels the older queued run),
# so one slow or hung run silently skips CI for every commit after it. PRs and feature branches stay
# grouped per ref, where cancelling superseded runs is what we want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  all-good:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      REPO: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Wait for every expected workflow and check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # This is deliberately an explicit contract. Discovering only the
          # workflow runs or check runs that already exist has an open-world
          # race: a queued workflow may not have reported either one yet.
          expected_workflows=(
            "e2e-fallback-tests.yaml"
            "lint-and-build.yaml"
            "docker-server-build-run.yaml"
            "setup-tests.yaml"
            "check-prisma-migrations.yaml"
            "bulldozer-serialization-compat.yaml"
            "table-of-contents.yaml"
            "setup-tests-with-custom-base-port.yaml"
            "fast-fail-tests.yaml"
            "e2e-api-tests.yaml"
          )
          case "$EVENT_NAME" in
            pull_request)
              expected_workflows+=("db-migration-backwards-compatibility.yaml")
              ;;
            push)
              if [ "$REF_NAME" = "dev" ]; then
                expected_workflows+=("docker-server-build-push.yaml")
                expected_workflows+=("db-migration-backwards-compatibility.yaml")
              elif [ "$REF_NAME" = "main" ]; then
                expected_workflows+=("docker-server-build-push.yaml")
                expected_workflows+=("npm-publish.yaml")
              else
                echo "Unexpected push branch for all-good: ${REF_NAME}" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unexpected event for all-good: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          function candidate_shas() {
            printf '%s\n' "$COMMIT"
            if [ -n "${PR_HEAD_SHA:-}" ] && [ "$PR_HEAD_SHA" != "$COMMIT" ]; then
              printf '%s\n' "$PR_HEAD_SHA"
            fi
          }

          function get_workflow_runs() {
            local responses_file
            responses_file=$(mktemp)

            while IFS= read -r sha; do
              local page=1
              while true; do
                local response
                if ! response=$(curl -sS --fail-with-body \
                  --retry 3 \
                  --retry-all-errors \
                  --connect-timeout 10 \
                  --max-time 30 \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${REPO}/actions/runs?event=${EVENT_NAME}&head_sha=${sha}&per_page=100&page=${page}"); then
                  echo "Error fetching workflow runs for ${sha}" >&2
                  rm -f "$responses_file"
                  return 1
                fi
                if ! jq -c '.workflow_runs[]?' <<< "$response" >> "$responses_file"; then
                  echo "Invalid Actions API response for ${sha}" >&2
                  rm -f "$responses_file"
                  return 1
                fi
                local page_count
                if ! page_count=$(jq '.workflow_runs | length' <<< "$response"); then
                  echo "Invalid Actions API response for ${sha}" >&2
                  rm -f "$responses_file"
                  return 1
                fi
                [ "$page_count" -lt 100 ] && break
                page=$((page + 1))
              done
            done < <(candidate_shas)

            jq -s '{ workflow_runs: unique_by(.id) }' "$responses_file"
            rm -f "$responses_file"
          }

          function get_check_runs() {
            local endpoint=$1
            local page=1
            local response
            local page_count
            local responses_file
            local expected_count
            local returned_count
            local combined
            responses_file=$(mktemp)

            while true; do
              if ! response=$(curl -sS --fail-with-body \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 10 \
                --max-time 30 \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${endpoint}?filter=latest&per_page=100&page=${page}"); then
                echo "Error fetching page ${page} from ${endpoint}" >&2
                rm -f "$responses_file"
                return 1
              fi

              printf '%s\n' "$response" >> "$responses_file"
              if ! page_count=$(jq '.check_runs | length' <<< "$response"); then
                echo "Invalid Checks API response from ${endpoint}" >&2
                rm -f "$responses_file"
                return 1
              fi

              [ "$page_count" -lt 100 ] && break
              page=$((page + 1))
            done

            # Check runs can be added while pagination is in progress. Deduplicate
            # overlapping pages, then fail closed if the collected pages do not
            # contain every run promised by the largest observed total_count.
            expected_count=$(jq -s '[.[].total_count // 0] | max // 0' "$responses_file")
            combined=$(jq -s '
              [.[].check_runs[]?] | unique_by(.id) as $runs
              | { total_count: ($runs | length), check_runs: $runs }
            ' "$responses_file")
            returned_count=$(jq '.total_count' <<< "$combined")
            rm -f "$responses_file"

            if [ "$returned_count" -lt "$expected_count" ]; then
              echo "Checks API returned ${returned_count} unique runs but reported ${expected_count}; refusing a partial result." >&2
              return 1
            fi

            printf '%s\n' "$combined"
          }

          # docker-server-build-push.yaml is deliberately serialized per ref (it publishes the moving
          # `dev`/`latest` image tags), and GitHub keeps at most one queued run per concurrency group.
          # So when several commits land on dev in quick succession, the runs for the middle commits
          # are cancelled and only the newest commit is built, which is exactly what we want for a
          # moving tag: the image that gets published is the newest one. A cancelled run is therefore
          # not a failure of this commit, as long as a newer run of the same workflow exists on the
          # same branch (i.e. this run was superseded, not cancelled by hand or by a runner problem).
          # A run cancelled while still queued never started any jobs, so it leaves no check runs
          # behind and the check-run gate below is unaffected.
          function is_superseded_run() {
            local workflow_file=$1
            local run_id=$2
            local response
            if ! response=$(curl -sS --fail-with-body \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow_file}/runs?event=${EVENT_NAME}&branch=${REF_NAME}&per_page=100"); then
              echo "Error fetching workflow runs for ${workflow_file} on ${REF_NAME}" >&2
              return 1
            fi
            local newer_count
            if ! newer_count=$(jq --argjson id "$run_id" '[.workflow_runs[]? | select(.id > $id)] | length' <<< "$response"); then
              echo "Invalid Actions API response for ${workflow_file}" >&2
              return 1
            fi
            [ "$newer_count" -gt 0 ]
          }

          function count_pending_checks() {
            local response=$1
            echo "$response" | jq '([.check_runs[]? | select(.status != "completed" and .name != "all-good" and .name != "claude-review")] | length) // 0'
          }

          function count_failed_checks() {
            local response=$1
            echo "$response" | jq '([.check_runs[]? | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .name != "all-good" and .name != "claude-review")] | length) // 0'
          }

          deadline=$(( $(date +%s) + 21600 ))
          while true; do
            workflow_response=$(get_workflow_runs)
            missing_workflows=()
            pending_workflows=()
            failed_workflows=()
            superseded_workflows=()

            for workflow_file in "${expected_workflows[@]}"; do
              workflow_path=".github/workflows/${workflow_file}"
              latest=$(jq -c --arg path "$workflow_path" '
                [.workflow_runs[]? | select(.path == $path)]
                | if length == 0 then null else max_by(.id) end
              ' <<< "$workflow_response")
              if [ "$latest" = "null" ]; then
                missing_workflows+=("$workflow_file")
                continue
              fi

              status=$(jq -r '.status' <<< "$latest")
              conclusion=$(jq -r '.conclusion // ""' <<< "$latest")
              if [ "$status" != "completed" ]; then
                pending_workflows+=("${workflow_file} (${status})")
              elif [ "$conclusion" != "success" ] && [ "$conclusion" != "skipped" ] && [ "$conclusion" != "neutral" ]; then
                run_id=$(jq -r '.id' <<< "$latest")
                if [ "$workflow_file" = "docker-server-build-push.yaml" ] && [ "$conclusion" = "cancelled" ] && is_superseded_run "$workflow_file" "$run_id"; then
                  superseded_workflows+=("${workflow_file} (run ${run_id})")
                else
                  failed_workflows+=("${workflow_file} (${conclusion})")
                fi
              fi
            done

            if [ "${#superseded_workflows[@]}" -gt 0 ]; then
              echo "Expected workflows cancelled because a newer commit on ${REF_NAME} superseded them (not counted as failures):"
              printf '  - %s\n' "${superseded_workflows[@]}"
            fi

            if [ "${#failed_workflows[@]}" -gt 0 ]; then
              echo "Expected workflow failures:"
              printf '  - %s\n' "${failed_workflows[@]}"
              exit 1
            fi

            if [ "${#missing_workflows[@]}" -gt 0 ] || [ "${#pending_workflows[@]}" -gt 0 ]; then
              if [ "${#missing_workflows[@]}" -gt 0 ]; then
                echo "Expected workflows not reported yet:"
                printf '  - %s\n' "${missing_workflows[@]}"
              fi
              if [ "${#pending_workflows[@]}" -gt 0 ]; then
                echo "Expected workflows still running:"
                printf '  - %s\n' "${pending_workflows[@]}"
              fi
            else
              # Expected GitHub workflows are now a closed, complete set. Check
              # every check run currently attached to this event's commit too,
              # so already-reported external checks can still block the gate.
              commit_response=$(get_check_runs "https://api.github.com/repos/${REPO}/commits/${COMMIT}/check-runs")
              pending_checks=$(count_pending_checks "$commit_response")
              failed_checks=$(count_failed_checks "$commit_response")
              if [ "$failed_checks" -gt 0 ]; then
                echo "The following check run(s) failed:"
                echo "$commit_response" | jq -r '.check_runs[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral" and .name != "all-good" and .name != "claude-review") | .name' | sed 's/^/  - /'
                exit 1
              fi
              if [ "$pending_checks" -eq 0 ]; then
                echo "Every expected workflow and reported check passed."
                exit 0
              fi
              echo "${pending_checks} reported check run(s) still in progress."
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after six hours waiting for the expected CI contract." >&2
              exit 1
            fi
            sleep 30
          done
