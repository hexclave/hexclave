name: Runs E2E API Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# A concurrency group only ever runs one run at a time, so the sha is part of the group on main/dev:
# otherwise consecutive dev pushes queue behind each other (and GitHub cancels the older queued run),
# so one slow or hung run silently skips CI for every commit after it. PRs and feature branches stay
# grouped per ref, where cancelling superseded runs is what we want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  wait-for-fast-fail:
    name: wait-for-fast-fail
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/wait-for-check
        with:
          workflow-file: fast-fail-tests.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    timeout-minutes: 300
    needs: wait-for-fast-fail
    name: E2E Tests (Node ${{ matrix.node-version }})
    runs-on: ubicloud-standard-8
    env:
      NODE_ENV: test
      HEXCLAVE_ENABLE_HARDCODED_PASSKEY_CHALLENGE_FOR_TESTING: yes
      HEXCLAVE_DATABASE_CONNECTION_STRING: "postgres://postgres:PASSWORD-PLACEHOLDER--uqfEC1hmmv@localhost:8128/stackframe"
      HEXCLAVE_EXTERNAL_DB_SYNC_MAX_DURATION_MS: "20000"
      HEXCLAVE_EXTERNAL_DB_SYNC_DIRECT: "false"

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Even just starting the Docker Compose as a daemon is slow because we have to download and build the images
      # so, we run it in the background
      - name: Start Docker Compose in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: docker compose -f docker/dependencies/docker.compose.yaml up --pull always -d &
          # we don't need to wait on anything, just need to start the daemon
          wait-on: /dev/null
          tail: true
          wait-for: 3s
          log-output-if: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.test.local file for apps/backend
        run: cp apps/backend/.env.development apps/backend/.env.test.local

      - name: Create .env.test.local file for apps/dashboard
        run: cp apps/dashboard/.env.development apps/dashboard/.env.test.local
      
      - name: Create .env.test.local file for apps/e2e
        run: cp apps/e2e/.env.development apps/e2e/.env.test.local

      - name: Create .env.test.local file for examples/cjs-test
        run: cp examples/cjs-test/.env.development examples/cjs-test/.env.test.local
      
      - name: Create .env.test.local file for examples/demo
        run: cp examples/demo/.env.development examples/demo/.env.test.local

      - name: Create .env.test.local file for examples/docs-examples
        run: cp examples/docs-examples/.env.development examples/docs-examples/.env.test.local

      - name: Create .env.test.local file for examples/e-commerce
        run: cp examples/e-commerce/.env.development examples/e-commerce/.env.test.local

      - name: Create .env.test.local file for examples/middleware
        run: cp examples/middleware/.env.development examples/middleware/.env.test.local

      - name: Create .env.test.local file for examples/supabase
        run: cp examples/supabase/.env.development examples/supabase/.env.test.local

      - name: Create .env.test.local file for examples/convex
        run: cp examples/convex/.env.development examples/convex/.env.test.local

      - name: Create .env.test.local file for apps/internal-tool
        run: cp apps/internal-tool/.env.development apps/internal-tool/.env.test.local

      - name: Build
        run: pnpm build

      - name: Wait on Postgres
        run: pnpm run wait-until-postgres-is-ready:pg_isready

      - name: Wait on Inbucket
        run: pnpm exec wait-on tcp:localhost:8129

      - name: Wait on Svix
        run: pnpm exec wait-on tcp:localhost:8113
      
      - name: Wait on QStash
        run: pnpm exec wait-on tcp:localhost:8125

      - name: Wait on ClickHouse
        run: pnpm exec wait-on http://localhost:8136/ping

      # The deployments e2e tests hit s3mock, fly-mock and gcp-mock directly; marshal's /health
      # does not touch any of them, so wait on them explicitly (both mocks are build:-from-context images).
      - name: Wait on s3mock
        run: pnpm exec wait-on http://localhost:8121/

      - name: Wait on fly-mock
        run: pnpm exec wait-on http://localhost:8148/health

      - name: Wait on gcp-mock
        run: pnpm exec wait-on http://localhost:8149/health

      - name: Initialize database
        run: pnpm run db:init
  
      - name: Start bulldozer-js in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        env:
          HEXCLAVE_BULLDOZER_JS_USE_TMP_LMDB: "1"
          HEXCLAVE_BULLDOZER_DIAGNOSTICS: "true"
        with:
          run: |
            bulldozer_log="$RUNNER_TEMP/hexclave-bulldozer.untracked.log"
            (
              set +e
              # Keep service output correlatable with the surrounding GitHub Actions logs.
              pnpm run start:bulldozer 2>&1 | TZ=UTC awk '{ print strftime("%Y-%m-%dT%H:%M:%SZ"), $0; fflush() }' >"$bulldozer_log"
              echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/hexclave-bulldozer-exit-code.untracked.txt"
            ) &
          wait-on: |
            tcp:localhost:8146
          tail: true
          wait-for: 30s
          log-output-if: true

      # db:init only seeds Postgres now; mirror the seeded payment rows into the
      # fresh bulldozer-js store so the backend's payment reads aren't empty.
      - name: Backfill Bulldozer from Postgres
        run: pnpm run db:backfill-bulldozer-from-prisma

      # Marshal (the deployments runtime) talks to the fly-mock, gcp-mock + s3mock
      # containers; the deployments e2e tests drive it through the backend.
      - name: Start marshal in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: NODE_ENV=test pnpm run start:marshal &
          wait-on: |
            http://localhost:8147/health
          tail: true
          wait-for: 30s
          log-output-if: true

      # The built server (node dist/server.mjs) does not auto-load .env files the way
      # `next start` used to, so it must be wrapped in with-env:test to pick up
      # .env.test.local (mirrors the e2e-fallback-tests workflow).
      - name: Start stack-backend in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm -C apps/backend run with-env:test pnpm run start &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start stack-mcp in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm run start:mcp --log-order=stream &
          wait-on: |
            http://localhost:8144/health
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start stack-dashboard in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm run start:dashboard --log-order=stream &
          wait-on: |
            http://localhost:8101
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start mock-oauth-server in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm run start:mock-oauth-server --log-order=stream &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start run-email-queue in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm -C apps/backend run run-email-queue --log-order=stream &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true
      - name: Start run-cron-jobs in background
        uses: JarvusInnovations/background-action@2428e7b970a846423095c79d43f759abf979a635 # v1.0.7
        with:
          run: pnpm -C apps/backend run run-cron-jobs:test --log-order=stream &
          wait-on: |
            http://localhost:8102
          tail: true
          wait-for: 30s
          log-output-if: true

      - name: Wait 10 seconds
        run: sleep 10

      - name: Reset process attribution
        continue-on-error: true
        run: .github/scripts/process-attribution.sh reset || true

      - name: Reset PostgreSQL statement attribution
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh reset

      - name: Run tests
        id: run_tests_pass1
        timeout-minutes: 60
        run: |
          set -o pipefail
          .github/scripts/process-attribution.sh sample \
            > "$RUNNER_TEMP/process-attribution-samples-pass1.untracked.tsv" &
          attribution_sampler_pid=$!
          stop_attribution_sampler() {
            kill "$attribution_sampler_pid" 2>/dev/null || true
            wait "$attribution_sampler_pid" 2>/dev/null || true
          }
          trap stop_attribution_sampler EXIT
          pnpm test run --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/e2e-test-results-pass1.untracked.json" 2>&1 |
            tee "$RUNNER_TEMP/e2e-test-output-pass1.untracked.log"
          pipeline_status=("${PIPESTATUS[@]}")
          stop_attribution_sampler
          trap - EXIT
          if [[ "${pipeline_status[1]}" -ne 0 ]]; then
            echo "::warning::tee failed while capturing pass 1 output; the test result is still used for the step status"
          fi
          exit "${pipeline_status[0]}"

      - name: Snapshot PostgreSQL attribution after pass 1
        if: always()
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh snapshot

      - name: Snapshot process attribution after pass 1
        if: always()
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh snapshot |
            tee "$RUNNER_TEMP/process-attribution-pass1.untracked.log" || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              mock_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}22"
              curl --fail --silent --show-error \
                "http://localhost:${mock_port}/diagnostics?reset=true" \
                > "$RUNNER_TEMP/freestyle-mock-diagnostics-pass1.untracked.json"
            ' || true

      - name: Wait for external DB sync to become idle before pass 2
        id: sync_barrier_pass1
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.run_tests_pass1.outcome != 'skipped'
        timeout-minutes: 35
        run: |
          pnpm -C apps/backend run with-env:test tsx scripts/wait-for-external-db-sync-idle.ts
          .github/scripts/postgres-attribution.sh reset || true
          .github/scripts/process-attribution.sh reset || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              mock_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}22"
              curl --fail --silent --show-error \
                "http://localhost:${mock_port}/diagnostics?reset=true" \
                >/dev/null
            ' || true

      - name: Run tests again (attempt 1)
        id: run_tests_pass2
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.sync_barrier_pass1.outcome == 'success'
        timeout-minutes: 75
        run: |
          set -o pipefail
          .github/scripts/process-attribution.sh sample \
            > "$RUNNER_TEMP/process-attribution-samples-pass2.untracked.tsv" &
          attribution_sampler_pid=$!
          stop_attribution_sampler() {
            kill "$attribution_sampler_pid" 2>/dev/null || true
            wait "$attribution_sampler_pid" 2>/dev/null || true
          }
          trap stop_attribution_sampler EXIT
          pnpm test run --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/e2e-test-results-pass2.untracked.json" 2>&1 |
            tee "$RUNNER_TEMP/e2e-test-output-pass2.untracked.log"
          pipeline_status=("${PIPESTATUS[@]}")
          stop_attribution_sampler
          trap - EXIT
          if [[ "${pipeline_status[1]}" -ne 0 ]]; then
            echo "::warning::tee failed while capturing pass 2 output; the test result is still used for the step status"
          fi
          exit "${pipeline_status[0]}"

      - name: Snapshot PostgreSQL attribution after pass 2
        if: always() && steps.run_tests_pass2.outcome != 'skipped'
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh snapshot

      - name: Snapshot process attribution after pass 2
        if: always() && steps.run_tests_pass2.outcome != 'skipped'
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh snapshot |
            tee "$RUNNER_TEMP/process-attribution-pass2.untracked.log" || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              mock_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}22"
              curl --fail --silent --show-error \
                "http://localhost:${mock_port}/diagnostics?reset=true" \
                > "$RUNNER_TEMP/freestyle-mock-diagnostics-pass2.untracked.json"
            ' || true

      - name: Wait for external DB sync to become idle before pass 3
        id: sync_barrier_pass2
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.run_tests_pass2.outcome != 'skipped'
        timeout-minutes: 35
        run: |
          pnpm -C apps/backend run with-env:test tsx scripts/wait-for-external-db-sync-idle.ts
          .github/scripts/postgres-attribution.sh reset || true
          .github/scripts/process-attribution.sh reset || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              mock_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}22"
              curl --fail --silent --show-error \
                "http://localhost:${mock_port}/diagnostics?reset=true" \
                >/dev/null
            ' || true

      - name: Run tests again (attempt 2)
        id: run_tests_pass3
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.sync_barrier_pass2.outcome == 'success'
        timeout-minutes: 105
        run: |
          set -o pipefail
          .github/scripts/process-attribution.sh sample \
            > "$RUNNER_TEMP/process-attribution-samples-pass3.untracked.tsv" &
          attribution_sampler_pid=$!
          stop_attribution_sampler() {
            kill "$attribution_sampler_pid" 2>/dev/null || true
            wait "$attribution_sampler_pid" 2>/dev/null || true
          }
          trap stop_attribution_sampler EXIT
          pnpm test run --reporter=default --reporter=json \
            --outputFile="$RUNNER_TEMP/e2e-test-results-pass3.untracked.json" 2>&1 |
            tee "$RUNNER_TEMP/e2e-test-output-pass3.untracked.log"
          pipeline_status=("${PIPESTATUS[@]}")
          stop_attribution_sampler
          trap - EXIT
          if [[ "${pipeline_status[1]}" -ne 0 ]]; then
            echo "::warning::tee failed while capturing pass 3 output; the test result is still used for the step status"
          fi
          exit "${pipeline_status[0]}"

      - name: Snapshot PostgreSQL attribution after pass 3
        if: always() && steps.run_tests_pass3.outcome != 'skipped'
        continue-on-error: true
        run: .github/scripts/postgres-attribution.sh snapshot

      - name: Snapshot process attribution after pass 3
        if: always() && steps.run_tests_pass3.outcome != 'skipped'
        continue-on-error: true
        run: |
          .github/scripts/process-attribution.sh snapshot |
            tee "$RUNNER_TEMP/process-attribution-pass3.untracked.log" || true
          pnpm -C apps/backend run with-env:test bash -c \
            '
              mock_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}22"
              curl --fail --silent --show-error \
                "http://localhost:${mock_port}/diagnostics?reset=true" \
                > "$RUNNER_TEMP/freestyle-mock-diagnostics-pass3.untracked.json"
            ' || true

      - name: Run perf tests
        env:
          HEXCLAVE_RUN_PERF_TESTS: "1"
        run: pnpm test run --min-workers=1 --max-workers=1 .perf.test

      - name: Verify data integrity
        run: pnpm run verify-data-integrity --no-bail

      - name: Print bulldozer-js diagnostics
        if: ${{ failure() }}
        run: |
          if [[ -f "$RUNNER_TEMP/hexclave-bulldozer-exit-code.untracked.txt" ]]; then
            echo "Bulldozer-js command exited with code $(<"$RUNNER_TEMP/hexclave-bulldozer-exit-code.untracked.txt")"
          else
            echo "Bulldozer-js command is still running; a child process may have exited"
          fi
          tail -n 2000 "$RUNNER_TEMP/hexclave-bulldozer.untracked.log"

      - name: Upload bulldozer-js logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-api-bulldozer
          path: ${{ runner.temp }}/hexclave-bulldozer.untracked.log
          if-no-files-found: warn

      - name: Capture bulldozer-js diagnostics
        if: always()
        continue-on-error: true
        run: |
          pnpm -C apps/backend run with-env:test bash -c \
            '
              bulldozer_port="${NEXT_PUBLIC_HEXCLAVE_PORT_PREFIX:-81}46"
              curl --fail --silent --show-error \
                -H "Authorization: Bearer ${HEXCLAVE_BULLDOZER_SERVER_SECRET}" \
                "http://localhost:${bulldozer_port}/diagnostics" \
                > "$RUNNER_TEMP/hexclave-bulldozer-diagnostics.untracked.json"
            '

      - name: Upload bulldozer-js diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-api-bulldozer-diagnostics
          path: ${{ runner.temp }}/hexclave-bulldozer-diagnostics.untracked.json
          if-no-files-found: warn

      - name: Upload E2E timing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-api-test-timing-diagnostics
          path: |
            ${{ runner.temp }}/e2e-test-results-pass*.untracked.json
            ${{ runner.temp }}/e2e-test-output-pass*.untracked.log
            ${{ runner.temp }}/freestyle-mock-diagnostics-pass*.untracked.json
            ${{ runner.temp }}/process-attribution-pass*.untracked.log
            ${{ runner.temp }}/process-attribution-samples-pass*.untracked.tsv
          if-no-files-found: warn

      - name: Print Docker Compose logs
        if: always()
        run: docker compose -f docker/dependencies/docker.compose.yaml logs
